name: forge

services:
  gateway:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:8080"          # bound on 0.0.0.0 for LAN access (LAN-only threat model, PLAN §7)
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ui-dist:/srv/ui:ro
      - caddy-data:/data
    networks: [forge-edge]
    depends_on:
      ui:
        condition: service_completed_successfully
      orchestrator:
        condition: service_started

  # Builds the PWA and copies the bundle into the shared ui-dist volume, then exits.
  ui:
    build: ./ui
    restart: "no"
    volumes:
      - ui-dist:/srv/ui
    command: ["sh", "-c", "rm -rf /srv/ui/* && cp -r /app/dist/. /srv/ui/"]

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    restart: unless-stopped
    # Optional: `make up` creates .env from .env.example, but a raw
    # `docker compose up` must not die when it is absent (all interpolations
    # below carry :-defaults).
    env_file:
      - path: .env
        required: false
    environment:
      FORGE_DB_PATH: ${FORGE_DB_PATH:-/data/db/forge.db}
      FORGE_MODELS_DIR: ${FORGE_MODELS_DIR:-/data/models}
      FORGE_SKILLS_DIR: ${FORGE_SKILLS_DIR:-/data/skills}
      FORGE_WORKSPACES_DIR: ${FORGE_WORKSPACES_DIR:-/data/workspaces}
      FORGE_DOCKER_NETWORK: ${FORGE_DOCKER_NETWORK:-forge-internal}
      FORGE_MODELS_VOLUME: ${FORGE_MODELS_VOLUME:-forge-models}
      FORGE_SKILLS_VOLUME: ${FORGE_SKILLS_VOLUME:-forge-skills}
      FORGE_WORKSPACES_VOLUME: ${FORGE_WORKSPACES_VOLUME:-forge-workspaces}
      # GPU access (NVML stats) lives in docker-compose.gpu.yml — `make up`
      # includes that overlay automatically when nvidia-smi is present, so a
      # CPU-only box brings the stack up cleanly (GPU stats show unavailable).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # ONLY here — sessions never get it (PLAN §1.5)
      - models:/data/models
      - db:/data/db
      - skills:/data/skills
      - workspaces:/data/workspaces
      - uploads:/data/uploads
    networks: [forge-edge, forge-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  searxng:
    image: searxng/searxng:2026.8.17-374939b88
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Overrides the committed placeholder in settings.yml; `make up`
      # generates a value into .env on first run.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-config:/etc/searxng/data
    networks: [forge-internal]

  mcp-playwright:
    image: mcr.microsoft.com/playwright/mcp:v0.0.49
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8931", "--headless", "--isolated"]
    networks: [forge-internal]

  # Stealth web fetching/scraping MCP (Scrapling): TLS-fingerprint HTTP get,
  # Playwright fetch, and Cloudflare-solving stealth Chromium, with markdown
  # extraction. Core connector for sessions AND the chat "read page" tool.
  # Internal network only, same trust posture as mcp-playwright.
  mcp-scrapling:
    image: ${FORGE_SCRAPLING_IMAGE:-ghcr.io/d4vinci/scrapling:0.4.14}
    restart: unless-stopped
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "8000"]
    networks: [forge-internal]

  # Context-compression proxy (Headroom): all chat-completion traffic flows
  # orchestrator/sessions -> headroom -> orchestrator /v1 router -> engines.
  # The orchestrator falls back to the direct engine path automatically when
  # this service is down or the toggle is off (Settings).
  headroom:
    image: ${FORGE_HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom:0.35.0}
    restart: unless-stopped
    environment:
      # /v1-direct is the router's headroom-free internal path — targeting the
      # public /v1 would loop (that path forwards to headroom when enabled).
      OPENAI_TARGET_API_URL: http://orchestrator:8000/v1-direct
      # No surprise model downloads on a self-hosted box: the ML prose
      # compressor stays off; JSON/log/code compressors work fully offline.
      HEADROOM_OFFLINE: "1"
    volumes:
      - headroom-cache:/home/nonroot/.cache
    networks: [forge-internal]

  # ── Sandbox lane (opt-in profile; requires /dev/kvm on the host) ──────────
  # smolvm boots hardware-isolated microVMs for the "run this code" tool.
  # Its control API has NO auth — it must never leave forge-internal.
  smolvm:
    profiles: ["sandbox"]
    build: ./sandbox/smolvm
    image: ${FORGE_SMOLVM_IMAGE:-forge-smolvm}
    restart: unless-stopped
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - sandbox-state:/var/lib/smolvm
    networks: [forge-internal]

  # ── Engine lanes ────────────────────────────────────────────────────────────
  # Defined under the "engines" profile so `docker compose up` never starts
  # them. The orchestrator's EngineManager starts exactly ONE at a time via the
  # docker socket, with per-model flags (PLAN §2, §6.2). These entries document
  # the images and let `docker compose --profile engines pull` prefetch them.
  llamacpp:
    profiles: ["engines"]
    image: ${FORGE_LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    volumes:
      - models:/data/models
    networks: [forge-internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm:
    profiles: ["engines"]
    image: ${FORGE_VLLM_IMAGE:-vllm/vllm-openai:v0.10.1}
    volumes:
      - models:/data/models
    networks: [forge-internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sglang:
    profiles: ["engines"]
    image: ${FORGE_SGLANG_IMAGE:-lmsysorg/sglang:v0.5.17}
    volumes:
      - models:/data/models
    networks: [forge-internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  airllm:
    profiles: ["engines"]
    build: ./engines/airllm
    image: ${FORGE_AIRLLM_IMAGE:-forge-airllm}
    volumes:
      - models:/data/models
    networks: [forge-internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  imagegen:
    profiles: ["engines"]
    build: ./engines/imagegen
    image: ${FORGE_IMAGEGEN_IMAGE:-forge-imagegen}
    volumes:
      - models:/data/models
    networks: [forge-internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Built here so `make up` produces the image the orchestrator spawns
  # sessions from; never started by compose itself.
  session-runner:
    profiles: ["build-only"]
    build: ./session-runner
    image: ${FORGE_SESSION_IMAGE:-forge-session-runner}

networks:
  forge-edge:
    name: forge-edge
  forge-internal:
    name: forge-internal
    # NOT `internal: true` — sessions need outbound for git/pip/npm (PLAN §4)

volumes:
  models:
    name: forge-models
  db:
    name: forge-db
  skills:
    name: forge-skills
  workspaces:
    name: forge-workspaces
  uploads:
    name: forge-uploads
  searxng-config:
    name: forge-searxng-config
  headroom-cache:
    name: forge-headroom-cache
  sandbox-state:
    name: forge-sandbox-state
  caddy-data:
    name: forge-caddy-data
  ui-dist:
    name: forge-ui-dist

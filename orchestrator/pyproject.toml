[project]
name = "forge-orchestrator"
version = "0.1.0"
description = "Forge orchestrator — engine lifecycle, session containers, model registry, one API for the PWA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlmodel>=0.0.22,<0.1",
    "pydantic-settings>=2.4,<3",
    "apscheduler>=3.10,<4",
    "docker>=7.1,<8",
    "huggingface_hub>=0.34,<1",
    "httpx>=0.27,<1",
    "psutil>=6,<8",
    "nvidia-ml-py>=12.550,<14",
    "argon2-cffi>=23,<26",
    "PyJWT>=2.8,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

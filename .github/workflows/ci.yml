# Forge CI (PLAN §12): lint (ruff) + orchestrator unit tests + UI typecheck/build.
# No GPU and no docker steps here — GPU paths are covered by scripts/smoke.sh
# on the real host (`make smoke`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (cached)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "orchestrator/pyproject.toml"
      - name: ruff check
        run: uv run --extra dev ruff check app tests

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (cached)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "orchestrator/pyproject.toml"
      - name: Create venv
        run: uv venv --python 3.12
      - name: Install orchestrator (editable, dev extras)
        run: uv pip install -e '.[dev]'
      - name: pytest
        run: .venv/bin/pytest -q

  ui:
    name: ui (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

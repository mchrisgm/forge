# Dev overrides: `make dev` (or docker compose -f docker-compose.yml -f docker-compose.dev.yml up)
# - orchestrator runs uvicorn --reload with source bind-mounted
# - UI dev server with hot reload exposed on :5173 (talks to the gateway for /api)
services:
  orchestrator:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./orchestrator/app:/app/app
      - ./scripts:/app/scripts:ro
      - models:/data/models
      - db:/data/db
      - skills:/data/skills
      - workspaces:/data/workspaces
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  ui-dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./ui:/app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    environment:
      # Vite proxies /api to the gateway in dev (see ui/vite.config.ts)
      VITE_API_PROXY_TARGET: http://gateway:8080
    networks: [forge-edge]
